PLG_SYSTEM_BIBLEBRAIN="System - Bible Brain Players"
PLG_SYSTEM_BIBLEBRAIN_XML_DESCRIPTION="Bible Reader, Audio Player and Video Player powered by the Bible Brain API (Faith Comes By Hearing). Enable this plugin, add your free API key, then type {bbp audio country=&quot;IN&quot; language=&quot;hin&quot; bible=&quot;HINDOV&quot;} in any article or custom module. Visitors choose country, language and version. <br><br>Links: <a href='https://www.faithcomesbyhearing.com/audio-bible-resources/bible-brain' target='_blank' rel='noopener'>Bible Brain</a> | <a href='https://www.faithcomesbyhearing.com/bible-brain/developer-documentation' target='_blank' rel='noopener'>Developer documentation</a> | <a href='https://www.faithcomesbyhearing.com/bible-brain/api-reference' target='_blank' rel='noopener'>API reference</a> | <a href='https://4.dbt.io/api_key/request' target='_blank' rel='noopener'>Request a free API key</a> | <a href='https://www.faithcomesbyhearing.com/bible-brain/license' target='_blank' rel='noopener'>License</a> | <a href='https://www.faithcomesbyhearing.com/bible-brain/terms-conditions' target='_blank' rel='noopener'>Terms</a>. Developed by Shalom Design S2dio (SDS), with the help of AI tools. This is an unofficial community project and is not published or supported by Faith Comes By Hearing."
PLG_SYSTEM_BIBLEBRAIN_API_KEY="API key"
PLG_SYSTEM_BIBLEBRAIN_API_KEY_DESC="Request your free key at https://4.dbt.io/api_key/request. The key stays on your server. Visitors never see it."
PLG_SYSTEM_BIBLEBRAIN_CACHE_HOURS="Cache catalog data (hours)"
PLG_SYSTEM_BIBLEBRAIN_ALLOWED_COUNTRIES="Limit the country list"
PLG_SYSTEM_BIBLEBRAIN_ALLOWED_COUNTRIES_DESC="Optional. Two-letter country codes separated by commas, for example IN, NP, BD, BT, LK, MV. Leave empty to show every country."
PLG_SYSTEM_BIBLEBRAIN_DEFAULTS="Default versions"
PLG_SYSTEM_BIBLEBRAIN_DEFAULTS_DESC="Each player opens with this version unless a tag sets its own. Find the codes with the embed code generator at media/plg_system_biblebrain/generator/generator.html on your site (add ?proxy=/index.php?bbapi= to the address)."
