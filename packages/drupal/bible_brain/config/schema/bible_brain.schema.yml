bible_brain.settings:
  type: config_object
  label: 'Bible Brain Players settings'
  mapping:
    api_key:
      type: string
      label: 'API key'
    cache_hours:
      type: integer
      label: 'Cache hours'
    accent:
      type: string
      label: 'Accent color'
    theme:
      type: string
      label: 'Theme'
    allowed_countries:
      type: string
      label: 'Allowed countries'
    share:
      type: boolean
      label: 'Share buttons'
    reflect:
      type: boolean
      label: 'Reflection prompts'
    listen:
      type: boolean
      label: 'Listen while reading'
    cdn_hls:
      type: boolean
      label: 'Load hls.js from CDN'
    reflect_prompts:
      type: string
      label: 'Reflection prompts'
    defaults:
      type: mapping
      label: 'Default versions'
      mapping:
        reader:
          type: bible_brain.default
        audio:
          type: bible_brain.default
        video:
          type: bible_brain.default

bible_brain.default:
  type: mapping
  label: 'Default version'
  mapping:
    country:
      type: string
    language:
      type: string
    bible:
      type: string
    fileset:
      type: string

block.settings.bible_brain_player:
  type: block_settings
  label: 'Bible Brain player block'
  mapping:
    player:
      type: string
    country:
      type: string
    language:
      type: string
    bible:
      type: string
    fileset:
      type: string
    book:
      type: string
    chapter:
      type: string
    selector:
      type: boolean
    share:
      type: string
    reflect:
      type: string
    listen:
      type: string
    player_title:
      type: string
