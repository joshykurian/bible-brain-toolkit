name: Release

# Push a tag such as v1.1.0 and this workflow builds the ZIP packages and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Check that the tag matches VERSION
        run: |
          if [ "v$(cat VERSION)" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1
          fi
      - name: Build packages
        run: python scripts/build.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "Bible Brain Toolkit ${GITHUB_REF_NAME}" \
            --notes-file <(python scripts/release_notes.py "$(cat VERSION)")
