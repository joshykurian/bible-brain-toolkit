name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [WordPress plugin, Drupal module, Joomla plugin, HTML5 embed / proxy, Downloader, Documentation]
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Versions
      description: Toolkit version, CMS version, PHP version, browser
  - type: textarea
    id: logs
    attributes:
      label: Error messages
      description: "Browser console or server log. Please remove your API key before pasting."
      render: text
