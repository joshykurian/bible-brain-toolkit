name: Feature request
description: Suggest an idea, especially one that helps audio-first or low-bandwidth communities
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Who needs this, and what would it help them do?
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Region, languages, platforms (WhatsApp, Telegram, Facebook and so on), connectivity
